    <script>
      tailwind.config = {

                purple: '#b537f2',
                green: '#64ffda',

              stark: {

              }
            },
            animation: {
              'spin-slow': 'spin 20s linear infinite',
            }
          }
        }
      }

    <style>
      html, body {
        background-color: #010810;
        color: #e6f1ff;

        width: 6px;

      ::-webkit-scrollbar-track {
        background: #020c1b;

      ::-webkit-scrollbar-thumb {

      ::-webkit-scrollbar-thumb:hover {

        background: rgba(17, 34, 64, 0.7);
